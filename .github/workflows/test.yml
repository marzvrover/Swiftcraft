name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    continue-on-error: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        swift: ["6.2.1", "6.4.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Status Check | Swift v${{ matrix.swift }} on ${{ matrix.os }} / unit tests
        uses: Sibz/github-status-action@v1
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: 'Swift v${{ matrix.swift }} on ${{ matrix.os }} / unit tests'
          description: 'Running unit tests with Swift v${{ matrix.swift }} on ${{ matrix.os }}'
          state: 'pending'
          sha: ${{github.event.pull_request.head.sha || github.sha}}
      - uses: actions/checkout@v3
      - name: Import Swift signing keys
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc --output swift-signing-keys.asc
          gpg --import swift-signing-keys.asc
          rm swift-signing-keys.asc
      - name: Setup Swift @ ${{ matrix.swift}}
        uses: swift-actions/setup-swift@v3.0.0-beta.1
        with:
          swift-version: ${{ matrix.swift }}
      - name: Run tests
        run: swift test -v
      - name: Status Check Success | Swift v${{ matrix.swift }} on ${{ matrix.os }} / unit tests
        if: ${{ success() }}
        uses: Sibz/github-status-action@v1
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: 'Swift v${{ matrix.swift }} on ${{ matrix.os }} / unit tests'
          description: 'Unit tests with Swift v${{ matrix.swift }} on ${{ matrix.os }} succeeded'
          state: 'success'
          sha: ${{github.event.pull_request.head.sha || github.sha}}
      - name: Status Check Failure | Swift v${{ matrix.swift }} on ${{ matrix.os }} / unit tests
        if: ${{ failure() }}
        uses: Sibz/github-status-action@v1
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: 'Swift v${{ matrix.swift }} on ${{ matrix.os }} / unit tests'
          description: 'Unit tests with Swift v${{ matrix.swift }} on ${{ matrix.os }} failed'
          state: 'failure'
          sha: ${{github.event.pull_request.head.sha || github.sha}}
